info:
  name: Create album
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/admin/gallery/"
  auth: inherit
  body:
    type: multipart-form
    data:
      - name: title
        type: text
        value: Mutirão de saúde
      - name: summary
        type: text
        value: Atendimento gratuito na praça.
      - name: event_type
        type: text
        value: Mutirão
      - name: location
        type: text
        value: Praça central
      - name: held_on
        type: text
        value: "2026-03-20"
      - name: cover_alt
        type: text
        value: Tenda na praça
      - name: cover
        type: file
        value: []
      - name: is_published
        type: text
        value: "true"

runtime:
  scripts:
    - type: before-request
      code: |-
        const token = bru.getVar("csrfToken");
        if (!token) {
          throw new Error("Run auth/Session first. It sets the csrftoken cookie.");
        }
        req.setHeader("X-CSRFToken", token);
    - type: after-response
      code: |-
        const raw = res.getHeader("set-cookie");
        const lines = Array.isArray(raw) ? raw : raw ? [raw] : [];
        for (const line of lines) {
          const match = /(?:^|[;,]\s*)csrftoken=([^;]+)/.exec(line);
          if (match) {
            bru.setVar("csrfToken", match[1]);
          }
        }
        if (res.status === 201 && res.body && res.body.id) {
          bru.setVar("galleryAlbumId", res.body.id);
          bru.setVar("gallerySlug", res.body.slug);
        }
    - type: tests
      code: |-
        test("status is 201", function () {
          expect(res.status).to.equal(201);
        });

settings:
  encodeUrl: true
