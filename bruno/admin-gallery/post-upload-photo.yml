info:
  name: Upload photo
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/v1/admin/gallery/:albumId/photos/"
  auth: inherit
  params:
    - name: albumId
      type: path
      value: "{{galleryAlbumId}}"
  body:
    type: multipart-form
    data:
      - name: image_alt
        type: text
        value: Pessoas na tenda da praça.
      - name: image
        type: file
        value: []

runtime:
  scripts:
    - type: before-request
      code: |-
        const token = bru.getVar("csrfToken");
        if (!token) {
          throw new Error("Run auth/Session first. It sets the csrftoken cookie.");
        }
        req.setHeader("X-CSRFToken", token);
    - type: after-response
      code: |-
        const raw = res.getHeader("set-cookie");
        const lines = Array.isArray(raw) ? raw : raw ? [raw] : [];
        for (const line of lines) {
          const match = /(?:^|[;,]\s*)csrftoken=([^;]+)/.exec(line);
          if (match) {
            bru.setVar("csrfToken", match[1]);
          }
        }
        if (res.status === 201 && res.body && res.body.id) {
          bru.setVar("galleryPhotoId", res.body.id);
        }
    - type: tests
      code: |-
        test("status is 201", function () {
          expect(res.status).to.equal(201);
        });

settings:
  encodeUrl: true
