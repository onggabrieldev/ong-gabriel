info:
  name: Create event
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/admin/events/"
  auth: inherit
  body:
    type: multipart-form
    data:
      - name: title
        type: text
        value: Roda de conversa sobre ansiedade
      - name: summary
        type: text
        value: Conversa aberta e gratuita sobre ansiedade, com profissionais voluntários.
      - name: description
        type: text
        value: Traga suas dúvidas.
      - name: event_type
        type: text
        value: Roda de conversa
      - name: location
        type: text
        value: Centro comunitário
      - name: starts_at
        type: text
        value: "2027-01-15T14:00"
      - name: ends_at
        type: text
        value: "2027-01-15T16:00"
      - name: accent
        type: text
        value: sky
      - name: image_alt
        type: text
        value: Pessoas sentadas em círculo.
      - name: image
        type: file
        value: []
      - name: is_published
        type: text
        value: "true"

runtime:
  scripts:
    - type: before-request
      code: |-
        const token = bru.getVar("csrfToken");
        if (!token) {
          throw new Error("Run auth/Session first. It sets the csrftoken cookie.");
        }
        req.setHeader("X-CSRFToken", token);
    - type: after-response
      code: |-
        const raw = res.getHeader("set-cookie");
        const lines = Array.isArray(raw) ? raw : raw ? [raw] : [];
        for (const line of lines) {
          const match = /(?:^|[;,]\s*)csrftoken=([^;]+)/.exec(line);
          if (match) {
            bru.setVar("csrfToken", match[1]);
          }
        }
        if (res.status === 201 && res.body && res.body.id) {
          bru.setVar("eventId", res.body.id);
        }
    - type: tests
      code: |-
        test("status is 201", function () {
          expect(res.status).to.equal(201);
        });

settings:
  encodeUrl: true
