info:
  name: Update testimonial
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/admin/testimonials/:id"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      type: path
      value: "{{testimonialId}}"
  body:
    type: json
    data: |-
      {
        "quote": "Texto atualizado.",
        "is_published": true
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        const token = bru.getVar("csrfToken");
        if (!token) {
          throw new Error("Run auth/Session first. It sets the csrftoken cookie.");
        }
        req.setHeader("X-CSRFToken", token);
    - type: after-response
      code: |-
        const raw = res.getHeader("set-cookie");
        const lines = Array.isArray(raw) ? raw : raw ? [raw] : [];
        for (const line of lines) {
          const match = /(?:^|[;,]\s*)csrftoken=([^;]+)/.exec(line);
          if (match) {
            bru.setVar("csrfToken", match[1]);
          }
        }
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
