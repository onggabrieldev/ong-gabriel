info:
  name: Google provider redirect
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/v1/_allauth/browser/v1/auth/provider/redirect"
  auth: inherit
  body:
    type: formUrlEncoded
    data:
      - name: provider
        value: google
      - name: callback_url
        value: "{{frontendUrl}}/conta/entrar"
      - name: process
        value: login

runtime:
  scripts:
    - type: before-request
      code: |-
        const token = bru.getVar("csrfToken");
        if (!token) {
          throw new Error("Run auth/Session first. It sets the csrftoken cookie.");
        }
        req.setHeader("X-CSRFToken", token);
    - type: after-response
      code: |-
        // Django rotates the CSRF token on login, so keep the latest one.
        const raw = res.getHeader("set-cookie");
        const lines = Array.isArray(raw) ? raw : raw ? [raw] : [];
        for (const line of lines) {
          const match = /(?:^|[;,]\s*)csrftoken=([^;]+)/.exec(line);
          if (match) {
            bru.setVar("csrfToken", match[1]);
          }
        }
    - type: tests
      code: |-
        test("status is 302", function () {
          expect(res.status).to.equal(302);
        });

settings:
  encodeUrl: true
