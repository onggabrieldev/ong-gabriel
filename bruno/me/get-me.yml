info:
  name: Me
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/me/"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.status).to.equal(200);
        });
        test("body has username", function () {
          expect(res.body.username).to.be.a("string");
        });

settings:
  encodeUrl: true
