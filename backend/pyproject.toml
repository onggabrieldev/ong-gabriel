[project]
name = "ong-gabriel-api"
version = "0.1.0"
description = "ONG Gabriel API"
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.143.0",
]

[project.scripts]
ong-gabriel-api = "ong_gabriel_api.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
