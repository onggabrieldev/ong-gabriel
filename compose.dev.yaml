services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ong_gabriel
      POSTGRES_PASSWORD: ong_gabriel
      POSTGRES_DB: ong_gabriel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ong_gabriel_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ong_gabriel -d ong_gabriel"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ong_gabriel_pgdata:
